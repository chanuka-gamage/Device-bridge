<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Device Bridge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #1b1e24; color: #e8e8e8; }
  #layout { display: flex; height: 100%; }
  #sidebar { width: 320px; padding: 16px; box-sizing: border-box; background: #23262e; overflow-y: auto; }
  #map { flex: 1; }
  h2 { margin-top: 0; font-size: 16px; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #12141a; color: #eee; }
  button { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #3b82f6; color: white; cursor: pointer; margin-bottom: 16px; }
  button:hover { background: #2563eb; }
  .device-card { background: #12141a; border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
  .device-card .name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .row { display: flex; justify-content: space-between; margin: 2px 0; color: #aaa; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .online { background: #22c55e; }
  .stale { background: #eab308; }
  #connStatus { font-size: 12px; color: #999; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h2>Device Bridge</h2>
    <input id="serverUrl" placeholder="Backend URL, e.g. https://your-backend.example.com" />
    <input id="token" placeholder="Shared token" type="password" />
    <button id="connectBtn">Connect</button>
    <div id="connStatus">Not connected</div>
    <div id="deviceList"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="renderer.js"></script>
</body>
</html>
